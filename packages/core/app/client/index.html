<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Loading...</title>
  <style>
    /* Boot splash: painted straight from the document so the first visit shows branding instead of a
       blank page while the application bundle loads. React replaces the contents of #root on its first
       commit, which removes the splash automatically. */
    #nb-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    #nb-splash .nb-splash-title {
      font-size: 28px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      letter-spacing: -0.02em;
    }

    #nb-splash .nb-splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(22, 119, 255, 0.25);
      border-top-color: #1677ff;
      border-radius: 50%;
      animation: nb-splash-spin 0.8s linear infinite;
    }

    @keyframes nb-splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="nb-splash" role="status" aria-live="polite" aria-label="Loading">
      <span class="nb-splash-title">NocoBase</span>
      <span class="nb-splash-spinner" aria-hidden="true"></span>
    </div>
  </div>
</body>

</html>
